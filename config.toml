baseURL = "https://eddyndumia.github.io/"
languageCode = "en-us"
title = "Eddy Ndumia"
theme = "PaperMod"

[params]
env = "production"
author = "Eddy Ndumia"
defaultTheme = "light"
disableThemeToggle = true
description = "Eddy Ndumia, software developer in Nairobi. Projects, resume and writing."
DateFormat = "2006-01-02"
# Buttondown username for the "get new posts by email" form. Empty = form hidden.
buttondownUser = ""
# buymeacoffee.com username for the note at the end of every post. Empty = hidden.
buyMeACoffee = "ndumia"

[params.footer]
text = "Emoji by [Twemoji](https://github.com/jdecked/twemoji) (CC-BY 4.0)"

[params.profileMode]
enabled = true
title = "Eddy Ndumia"
subtitle = "I'm Eddy, a software developer in Nairobi. I finish my B.Sc. in Mathematics and Computer Science at JKUAT in December 2026. I lead technology at Famyard Enterprises, a land sales company, where I built their website and the system the staff run the business on. I also built the website and dealer system for Apex AutoMobiles, and I've done freelance web work for small businesses since 2020. My own product is Chukua, a giveaway app live on Android in Nairobi. The work I care most about sits where software meets money: payments, finance and data."
imageUrl = "images/profile.jpg"
imageWidth = 120
imageHeight = 120
imageTitle = "Eddy Ndumia"

