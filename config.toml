baseURL = "https://ndumia.netlify.app/"
languageCode = "en-us"
title = "Eddy Ndumia"
theme = "PaperMod"

[params]
env = "production"
author = "Eddy Ndumia"
defaultTheme = "light"
disableThemeToggle = true
description = "Personal website — projects, bio, thoughts"
DateFormat = "2006-01-02"
# Buttondown username for the "get new posts by email" form. Empty = form hidden.
buttondownUser = ""
# buymeacoffee.com username for the note at the end of every post. Empty = hidden.
buyMeACoffee = "ndumia"

[params.footer]
text = "Emoji by [Twemoji](https://github.com/jdecked/twemoji) (CC-BY 4.0)"

[params.profileMode]
enabled = true
title = "Eddy Ndumia"
subtitle = "Hi, I'm Eddy. I'm finishing a degree in Maths and Computer Science at JKUAT this December. I've been building websites for small businesses in Kenya since 2020, and lately I do more data work on AWS, the kind where you clean up messy data and build pipelines that don't fall over. What I really get excited about is where money and tech meet, so crypto, AI and finance. I write about what I'm building and what goes wrong along the way, it's all under Thoughts."
imageUrl = "images/profile.jpg"
imageWidth = 120
imageHeight = 120
imageTitle = "Eddy Ndumia"

[[params.socialIcons]]
name = "github"
url = "https://github.com/eddyndumia"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/eddyndumia/"

[[params.socialIcons]]
name = "twitter"
url = "https://twitter.com/traderndumia"

[pagination]
pagerSize = 10

[minify]
disableJSON = true

